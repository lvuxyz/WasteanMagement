buildscript {
    ext.kotlin_version = '2.3.21'
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = "mapbox"
                password = project.hasProperty('MAPBOX_DOWNLOADS_TOKEN') ? project.property('MAPBOX_DOWNLOADS_TOKEN') : System.getenv('MAPBOX_DOWNLOADS_TOKEN')
            }
        }
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.2'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
        maven {
            url 'https://api.mapbox.com/downloads/v2/releases/maven'
            authentication {
                basic(BasicAuthentication)
            }
            credentials {
                username = "mapbox"
                password = project.hasProperty('MAPBOX_DOWNLOADS_TOKEN') ? project.property('MAPBOX_DOWNLOADS_TOKEN') : System.getenv('MAPBOX_DOWNLOADS_TOKEN')
            }
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"

    // Module :app tự đặt compileSdk qua flutter.compileSdkVersion và đã được
    // Gradle đánh giá xong ở thời điểm này, nên chỉ xử lý các module plugin.
    if (project.path != ":app") {
        project.evaluationDependsOn(":app")

        afterEvaluate {
            if (project.hasProperty('android')) {
                project.android {
                    try {
                        if (namespace == null) {
                            namespace = project.group ?: "com.example.namespace"
                        }
                    } catch (Exception e) {
                        // Bỏ qua lỗi nếu có
                        println "Note: Could not set namespace for ${project.name}: ${e.message}"
                    }

                    // Một số plugin (vd: mapbox_maps_flutter 2.11.0) vẫn ghim
                    // compileSdk 33, trong khi các thư viện AndroidX mà chúng
                    // phụ thuộc yêu cầu biên dịch với API 34 trở lên. Nâng sàn
                    // compileSdk cho các module plugin để Gradle không chặn build.
                    if (compileSdk != null && compileSdk < 34) {
                        compileSdk = 36
                    }
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
